<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Plataforma de registro, consulta y análisis de viajes y viáticos · UGR-MAG">
  <title>Viajes UGR</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://jmyioejtexnzvdrimepp.supabase.co" crossorigin>
  <link rel="modulepreload" href="js/app.js">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/table.css">

  <script>
    /* Aplica tema/densidad/menú antes del primer render (evita parpadeo) */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('viaticos.prefs.v3') || '{}');
        var t = p.theme || localStorage.getItem('tema') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var d = document.documentElement;
        d.dataset.theme = t;
        d.dataset.density = p.density || 'comfortable';
        d.dataset.sidebar = p.sidebarCollapsed ? 'collapsed' : 'expanded';
      } catch (e) { /* sin acceso a localStorage */ }
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Menú lateral"></aside>
    <div class="sb-overlay" id="sbOverlay"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div id="banners" aria-live="polite"></div>
      <main class="content" id="content">
        <section data-view="dashboard" hidden></section>
        <section data-view="registros" hidden></section>
        <section data-view="configuracion" hidden></section>
        <div class="boot" id="boot" aria-label="Cargando plataforma">
          <div class="boot-card"><span class="skeleton-bar w-40"></span><span class="skeleton-bar w-60"></span></div>
          <div class="boot-card"><span class="skeleton-bar w-80"></span><span class="skeleton-bar w-60"></span></div>
          <div class="boot-card" style="height:320px"><span class="skeleton-bar w-80"></span><span class="skeleton-bar w-80"></span><span class="skeleton-bar w-60"></span></div>
        </div>
      </main>
      <footer class="app-footer">© 2026 · Elaborado por <strong>Diego Rodriguez</strong> · Viajes UGR · UGR-MAG</footer>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Esta plataforma requiere JavaScript habilitado.</p></noscript>
</body>
</html>
