name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta cada 5 días (margen de seguridad bajo el límite de 7 días de Supabase Free)
    - cron: '0 6 */5 * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

permissions:
  contents: write
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hacer consulta real a la API de Supabase
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/actividades1?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Código de respuesta HTTP: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::El ping a Supabase falló (HTTP $HTTP_STATUS). El proyecto podría pausarse por inactividad."
            exit 1
          fi

          echo "✅ Ping exitoso. Proyecto Supabase mantenido activo."

      - name: Registrar actividad en el repositorio (evita el auto-disable de GitHub a los 60 días)
        run: |
          mkdir -p .github/keepalive
          echo "Último ping exitoso: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive/last_ping.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          git add .github/keepalive/last_ping.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: keep-alive ping $(date -u '+%Y-%m-%d')"
            git push
          else
            echo "Sin cambios para commitear."
          fi

      - name: Reactivar el workflow si GitHub lo deshabilitó por inactividad
        if: always()
        run: |
          WORKFLOW_ID=$(gh api repos/${{ github.repository }}/actions/workflows --jq '.workflows[] | select(.name=="Mantener Supabase Activo") | .id')
          gh api --method PUT repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/enable || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
